<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Hi, I'm Niki — personal homepage." />
    <title>@niki914</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- SCROLL REVEAL HERO — a tall wrap pins the hero for the first
         140vh of scrolling: scroll progress opens a cog-shaped window
         in the olive cover, then reveals the text element by element.
         Scroll back up to close it again. The final 100vh let the
         next page slide up over the still-pinned hero. -->
    <div class="hero-wrap">
      <header class="hero" aria-label="Hi, I'm Niki">

        <!-- decorative physics layer: behind the type, above the dot ground -->
        <canvas class="fx-layer" aria-hidden="true"></canvas>

        <div class="hero-content">
          <!-- centered name -->
          <h1>
            <span class="w" data-el="w0">Hi,</span>
            <span class="w" data-el="w1">I'm</span>
            <span class="name w" data-el="w2">Niki<em class="accent">.</em></span>
          </h1>
          <p class="subtitle fade" data-el="sub">
            houman dang
          </p>

          <!-- four facts -->
          <div class="facts">
            <div class="fact pop" data-el="f0">
              <div class="k">college</div>
              <div class="v">GDUT<br /><em>Software Engineering</em></div>
            </div>
            <div class="fact pop" data-el="f1">
              <div class="k">intern</div>
              <div class="v">ByteDance<br /><em>Toutiao R&amp;D<br />7 months</em></div>
            </div>
            <div class="fact pop" data-el="f2">
              <div class="k">tech stack</div>
              <div class="v">Android<br /><em>Kotlin</em><br />AI Agent<br />Frontend</div>
            </div>
            <div class="fact pop" data-el="f3">
              <div class="k">english</div>
              <div class="v">Bilinguals S5<br /><em>since 2025.9</em></div>
            </div>
          </div>

          <!-- closer -->
          <p class="pull wipe" data-el="pull">Nice to <span class="accent">meet you</span>.</p>
        </div>

        <!-- PRE PAGE — a blank olive cover, cut open by a cog. The
             window is the silhouette of the amber cog from the
             physics layer: the green cover is simply peeled open in
             a cog shape from the bottom-right corner as you scroll
             (see js/reveal.js). opacity: 0 by default — reveal.js
             turns it on with the closed cover before first paint. -->
        <div class="pre" id="preCover" aria-hidden="true">
          <span class="pre-tag">@ niki914</span>
        </div>

      </header>
    </div>

    <!-- NEXT PAGE — blank for now -->
    <section class="next" aria-label="more about me"></section>

    <script src="js/physics.js"></script>
    <script src="js/reveal.js"></script>
  </body>
</html>
